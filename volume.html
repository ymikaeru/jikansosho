<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自観叢書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="data/library.js"></script>
<script src="js/common.js"></script>
<script>JKS.writeVolumeData(false);</script>
</head>
<body class="page-home">
<div class="home">

  <div class="home-top">
    <a class="brand" href="index.html">‹ 自観叢書</a>
  </div>

  <section class="hero" aria-labelledby="bookTitle">
    <img class="hero-cover" id="cover" alt="" width="200">
    <div>
      <p class="eyebrow" id="series"></p>
      <h1 id="bookTitle"></h1>
      <p class="byline">岡田自観（明主様）著 ・ <span id="date"></span></p>
      <div class="cta">
        <a class="btn btn-primary" id="ctaRead" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
          <span id="ctaReadLabel">第一話から読む</span>
        </a>
        <a class="btn" id="ctaListen" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
          聞く
        </a>
      </div>
      <p class="cta-sub" id="ctaSub"></p>
      <div class="progress" id="progress" hidden>
        <span id="progressText"></span>
        <div class="progress-bar" aria-hidden="true"><span id="progressFill" style="width:0"></span></div>
      </div>
    </div>
  </section>

  <h2 class="section-title">目次</h2>
  <ol class="toc" id="toc"></ol>
</div>

<script src="js/volume.js"></script>
</body>
</html>
